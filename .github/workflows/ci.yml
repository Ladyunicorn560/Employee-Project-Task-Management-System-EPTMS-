name: EPTMS CI – Build, Lint & Regression Tests

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  build-and-test:
    name: Build, Lint & Regression Suite
    runs-on: windows-latest
    timeout-minutes: 30

    env:
      NODE_ENV: test
      PORT: 5000
      DB_SERVER: localhost
      DB_NAME: EPTMS_DB
      DB_USER: sa
      DB_PASSWORD: ${{ secrets.MSSQL_SA_PASSWORD }}
      DB_TRUST_SERVER_CERTIFICATE: 'true'
      DB_ENCRYPT: 'false'
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      JWT_EXPIRES_IN: 8h
      CORS_ORIGIN: http://localhost:3000
      RATE_LIMIT_WINDOW_MS: '900000'
      RATE_LIMIT_MAX_REQUESTS: '1000'
      LOG_LEVEL: warn

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Node.js 18 ───────────────────────────────────────────────
      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      # ── 3. Install dependencies ────────────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── 4. Lint ────────────────────────────────────────────────────────────
      - name: Run ESLint
        run: npm run lint

      # ── 5. Dependency audit ───────────────────────────────────────────────
      - name: Security audit (high severity)
        run: npm audit --audit-level=high
        continue-on-error: true   # informational; don't fail build for transitive deps

      # ── 6. Start SQL Server ────────────────────────────────────────────────
      - name: Start SQL Server (Docker)
        run: |
          docker run -d \
            --name eptms-sqlserver \
            -e "ACCEPT_EULA=Y" \
            -e "SA_PASSWORD=${{ secrets.MSSQL_SA_PASSWORD }}" \
            -p 1433:1433 \
            mcr.microsoft.com/mssql/server:2022-latest
        shell: bash

      - name: Wait for SQL Server to be ready
        run: |
          for i in $(seq 1 30); do
            docker exec eptms-sqlserver /opt/mssql-tools18/bin/sqlcmd \
              -S localhost -U sa -P "${{ secrets.MSSQL_SA_PASSWORD }}" \
              -Q "SELECT 1" -No -C && echo "SQL Server ready" && break
            echo "Waiting for SQL Server... ($i/30)"
            sleep 5
          done
        shell: bash

      # ── 7. Run database migrations & seed ─────────────────────────────────
      - name: Initialize EPTMS_DB schema & seed data
        run: |
          for f in database/01_CreateTables.sql database/02_CreateConstraints.sql \
                   database/03_CreateIndexes.sql database/04_CreateViews.sql \
                   database/05_CreateProcedures.sql database/06_SeedData.sql \
                   database/07_AddAuthColumnsToEmployee.sql \
                   database/09_UpdateTaskStatusConstraint.sql \
                   database/10_AddSubtaskColumns.sql \
                   database/12_UpdateReviewStatusConstraint.sql; do
            echo "Running: $f"
            docker exec -i eptms-sqlserver /opt/mssql-tools18/bin/sqlcmd \
              -S localhost -U sa -P "${{ secrets.MSSQL_SA_PASSWORD }}" \
              -i /dev/stdin -No -C < "$f" || true
          done
        shell: bash

      # ── 8. Start API server ────────────────────────────────────────────────
      - name: Start EPTMS API server
        run: Start-Process node -ArgumentList "server.js" -NoNewWindow
        shell: pwsh

      - name: Wait for API health check
        run: |
          for i in $(seq 1 20); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5000/api/v1/health || echo 000)
            if [ "$STATUS" = "200" ]; then echo "API is healthy"; break; fi
            echo "Waiting for API... ($i/20)"
            sleep 3
          done
        shell: bash

      # ── 9. Execute full regression suite ──────────────────────────────────
      - name: Run full regression suite (Phases 2–15)
        run: node scratch/testFullRegressionSuite.js
        timeout-minutes: 15

      # ── 10. Upload logs on failure ─────────────────────────────────────────
      - name: Upload regression logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: regression-logs-${{ github.run_number }}
          path: logs/
          retention-days: 7
