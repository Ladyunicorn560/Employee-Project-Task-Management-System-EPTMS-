version: '3.9'

services:
  # ─── SQL Server ──────────────────────────────────────────────────────────────
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: eptms-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
      MSSQL_PID: Express
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
      - ./database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" -No -C
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s
    networks:
      - eptms-network

  # ─── EPTMS API ────────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: eptms-api:latest
    container_name: eptms-api
    restart: unless-stopped
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      # Database – connect to the sibling SQL Server container
      DB_SERVER: sqlserver
      DB_NAME: "${DB_NAME:-EPTMS_DB}"
      DB_USER: "${DB_USER:-sa}"
      DB_PASSWORD: "${MSSQL_SA_PASSWORD}"
      DB_TRUST_SERVER_CERTIFICATE: "true"
      DB_ENCRYPT: "false"
      # JWT
      JWT_SECRET: "${JWT_SECRET}"
      JWT_EXPIRES_IN: "${JWT_EXPIRES_IN:-8h}"
      # Security
      CORS_ORIGIN: "${CORS_ORIGIN:-http://localhost:3000}"
      RATE_LIMIT_WINDOW_MS: "${RATE_LIMIT_WINDOW_MS:-900000}"
      RATE_LIMIT_MAX_REQUESTS: "${RATE_LIMIT_MAX_REQUESTS:-100}"
      # Logging
      LOG_LEVEL: "${LOG_LEVEL:-info}"
    ports:
      - "${DOCKER_PORT:-5000}:5000"
    volumes:
      - api_logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/api/v1/health | grep -q '\"status\":200' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - eptms-network

volumes:
  sqlserver_data:
    driver: local
  api_logs:
    driver: local

networks:
  eptms-network:
    driver: bridge
